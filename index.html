<!-- splash: once per session and after each sign-in, 3 s; not shown with reduced motion (see .kl-splash) -->
<div class="kl-splash" id="kl-splash" hidden aria-hidden="true">
  <img class="kl-mark-img kl-for-light" src="brand/klaket-mark-on-light.svg" alt=""><img class="kl-mark-img kl-for-dark" src="brand/klaket-mark-on-dark.svg" alt="">
  <span class="kl-dots"><i></i><i></i><i></i></span>
  <span class="kl-say" lang="ar">أكشن · ACTION</span>
</div>
<script>
  (function () { // the splash plays once per browser session, and again right after signing in (MPH.splash)
    var tpl = document.getElementById('kl-splash'), still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var MPH = (window.MPH = window.MPH || {}), keep = tpl.cloneNode(true);
    /* play it now; the returned function ends it, but never before the 3 s sequence has finished */
    MPH.splash = function (el) {
      if (still) return function () {};
      el = el || keep.cloneNode(true);
      if (!el.isConnected) document.body.appendChild(el);
      el.hidden = false;
      var t0 = Date.now(), ended = false;
      return function () {
        if (ended) return; ended = true;
        setTimeout(function () { el.classList.add('done'); setTimeout(function () { el.remove(); }, 500); }, Math.max(0, 3000 - (Date.now() - t0)));
      };
    };
    var seen = false;
    try { seen = sessionStorage.getItem('klaket.splash') === '1'; sessionStorage.setItem('klaket.splash', '1'); } catch (e) {}
    if (seen || still) return tpl.remove();
    MPH.splash(tpl)();
  })();
</script>
<div id="overlay" hidden></div>
<div id="toasts" aria-live="polite"></div>
